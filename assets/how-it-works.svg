<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C21"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A15B"/>
      <stop offset="50%" stop-color="#F0D98A"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
    <filter id="goldglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="470" fill="url(#bg)" rx="12"/>
  <rect width="900" height="470" fill="none" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.2" rx="12"/>

  <!-- eyebrow + headline -->
  <text x="450" y="40" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="12" letter-spacing="5" fill="#C6A15B" fill-opacity="0.85">HOW IT WORKS</text>
  <text x="450" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#F2F3F5">
    Claude Code <tspan fill="#6B7280">→</tspan> <tspan fill="url(#gold)" font-weight="bold">ATO</tspan> <tspan fill="#6B7280">→</tspan> Your Shell</text>

  <!-- ── LEFT CARD · Claude Code ── -->
  <rect x="20" y="118" width="224" height="252" rx="10" fill="#1F2630" stroke="#2ECC71" stroke-opacity="0.35"/>
  <rect x="36" y="136" width="40" height="40" rx="9" fill="#20302A" stroke="#2ECC71" stroke-opacity="0.5"/>
  <text x="56" y="162" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#2ECC71">&gt;_</text>
  <text x="88" y="162" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F3F5">Claude Code</text>
  <text x="36" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B9BFC7">
    <tspan x="36" dy="0">Runs autonomous commands.</tspan>
    <tspan x="36" dy="19">Receives pure signal — 265</tspan>
    <tspan x="36" dy="19">tokens, not 32,527. Same</tspan>
    <tspan x="36" dy="19">information, budget intact.</tspan>
  </text>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#7FE0A8">
    <rect x="36" y="298" width="54" height="26" rx="13" fill="#20302A" stroke="#2ECC71" stroke-opacity="0.3"/>
    <text x="63" y="315" text-anchor="middle">Opus</text>
    <rect x="96" y="298" width="66" height="26" rx="13" fill="#20302A" stroke="#2ECC71" stroke-opacity="0.3"/>
    <text x="129" y="315" text-anchor="middle">Sonnet</text>
    <rect x="168" y="298" width="58" height="26" rx="13" fill="#20302A" stroke="#2ECC71" stroke-opacity="0.3"/>
    <text x="197" y="315" text-anchor="middle">Haiku</text>
    <rect x="36" y="332" width="90" height="26" rx="13" fill="#20302A" stroke="#2ECC71" stroke-opacity="0.3"/>
    <text x="81" y="349" text-anchor="middle">Bash tool</text>
  </g>

  <!-- ── MIDDLE CARD · ATO Engine (elevated) ── -->
  <rect x="332" y="104" width="236" height="280" rx="12" fill="#232B36" stroke="url(#gold)" stroke-width="1.6" filter="url(#goldglow)" stroke-opacity="0.95"/>
  <rect x="348" y="124" width="40" height="40" rx="9" fill="#2B2F36" stroke="#C6A15B" stroke-opacity="0.8"/>
  <text x="368" y="151" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#F0D98A">⇄</text>
  <text x="400" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F0D98A">ATO Engine</text>
  <text x="348" y="192" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#D8CBAA">
    <tspan x="348" dy="0">Hooks intercept command I/O</tspan>
    <tspan x="348" dy="19">— rewrite high-output verbs,</tspan>
    <tspan x="348" dy="19">strip noise, keep meaning.</tspan>
    <tspan x="348" dy="19">Code passes byte-exact.</tspan>
  </text>
  <g font-family="'Courier New', monospace" font-size="12" fill="#E8D7A8">
    <rect x="348" y="280" width="100" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="398" y="297" text-anchor="middle">ask-rewrite</text>
    <rect x="456" y="280" width="88" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="500" y="297" text-anchor="middle">ask-filter</text>
    <rect x="348" y="314" width="84" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="390" y="331" text-anchor="middle">lossless</text>
    <rect x="440" y="314" width="104" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="492" y="331" text-anchor="middle">100% local</text>
    <rect x="348" y="348" width="92" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="394" y="365" text-anchor="middle">ask audit</text>
    <rect x="448" y="348" width="100" height="26" rx="13" fill="#252931" stroke="#C6A15B" stroke-opacity="0.45"/>
    <text x="498" y="365" text-anchor="middle">ask update</text>
  </g>

  <!-- ── RIGHT CARD · Your Shell ── -->
  <rect x="656" y="118" width="224" height="252" rx="10" fill="#1F2630" stroke="#E74C3C" stroke-opacity="0.35"/>
  <rect x="672" y="136" width="40" height="40" rx="9" fill="#302422" stroke="#E74C3C" stroke-opacity="0.5"/>
  <text x="692" y="163" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#E74C3C">$</text>
  <text x="724" y="162" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F3F5">Your Shell</text>
  <text x="672" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#B9BFC7">
    <tspan x="672" dy="0">Runs the real command.</tspan>
    <tspan x="672" dy="19">Emits massive raw logs —</tspan>
    <tspan x="672" dy="19">progress bars, warnings,</tspan>
    <tspan x="672" dy="19">repetition, boilerplate.</tspan>
  </text>
  <g font-family="'Courier New', monospace" font-size="12" fill="#FFB3A8">
    <rect x="672" y="298" width="84" height="26" rx="13" fill="#302422" stroke="#E74C3C" stroke-opacity="0.3"/>
    <text x="714" y="315" text-anchor="middle">grep -rn</text>
    <rect x="764" y="298" width="104" height="26" rx="13" fill="#302422" stroke="#E74C3C" stroke-opacity="0.3"/>
    <text x="816" y="315" text-anchor="middle">cargo build</text>
    <rect x="672" y="332" width="80" height="26" rx="13" fill="#302422" stroke="#E74C3C" stroke-opacity="0.3"/>
    <text x="712" y="349" text-anchor="middle">git diff</text>
    <rect x="760" y="332" width="50" height="26" rx="13" fill="#302422" stroke="#E74C3C" stroke-opacity="0.3"/>
    <text x="785" y="349" text-anchor="middle">cat</text>
  </g>

  <!-- ── arrows · left gap (244..332) ── -->
  <text x="288" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#C6A15B" fill-opacity="0.9">run command</text>
  <line x1="252" y1="196" x2="314" y2="196" stroke="#C6A15B" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="314,191 324,196 314,201" fill="#C6A15B" fill-opacity="0.8"/>
  <line x1="324" y1="244" x2="262" y2="244" stroke="#2ECC71" stroke-width="1.6"/>
  <polygon points="262,239 252,244 262,249" fill="#2ECC71"/>
  <text x="288" y="266" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#2ECC71">clean signal</text>
  <text x="288" y="281" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#2ECC71" fill-opacity="0.75">265 tokens</text>

  <!-- ── arrows · right gap (568..656) ── -->
  <text x="612" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#C6A15B" fill-opacity="0.9">execute</text>
  <line x1="576" y1="196" x2="638" y2="196" stroke="#C6A15B" stroke-width="1.4" stroke-opacity="0.8"/>
  <polygon points="638,191 648,196 638,201" fill="#C6A15B" fill-opacity="0.8"/>
  <line x1="648" y1="244" x2="586" y2="244" stroke="#E74C3C" stroke-width="1.6"/>
  <polygon points="586,239 576,244 586,249" fill="#E74C3C"/>
  <text x="612" y="266" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#E74C3C">raw noise</text>
  <text x="612" y="281" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#E74C3C" fill-opacity="0.75">32,527 tokens</text>

  <!-- caption -->
  <text x="450" y="420" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9AA2AB">ATO filters at the tool layer, on your machine — <tspan fill="#F0D98A" font-weight="600">only the signal reaches Claude.</tspan></text>
  <text x="450" y="443" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9AA2AB"><tspan fill="#E8D7A8" font-weight="600">Fail-open by design:</tspan> binary missing → output passes through untouched. The session never breaks.</text>
</svg>
