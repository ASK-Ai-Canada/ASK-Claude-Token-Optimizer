<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181F"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#E8CD9A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bg)" rx="12"/>
  <rect width="900" height="520" fill="none" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.2" rx="12"/>

  <text x="450" y="34" text-anchor="middle" fill="#C6A15B" font-size="15" letter-spacing="3" font-weight="bold">WINDOWS INSTALL — ONE SCRIPT · FOUR ANSWERS · DONE</text>

  <!-- ====== left: the boxes ====== -->
  <g font-size="13" fill="#9BA3AE">
    <!-- box 1 -->
    <rect x="36" y="66" width="16" height="16" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M39 74 l4 4 l7 -8" stroke="#3FB68B" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.175;0.98" dur="16s" repeatCount="indefinite"/>
    </path>
    <text x="62" y="79">accept the license</text>
    <!-- box 2 -->
    <rect x="36" y="106" width="16" height="16" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M39 114 l4 4 l7 -8" stroke="#3FB68B" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.3125;0.98" dur="16s" repeatCount="indefinite"/>
    </path>
    <text x="62" y="119">work email + name</text>
    <!-- box 3 -->
    <rect x="36" y="146" width="16" height="16" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M39 154 l4 4 l7 -8" stroke="#3FB68B" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.98" dur="16s" repeatCount="indefinite"/>
    </path>
    <text x="62" y="159">free tier — under CAD $100k</text>
    <!-- box 4 -->
    <rect x="36" y="186" width="16" height="16" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M39 194 l4 4 l7 -8" stroke="#3FB68B" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.7125;0.98" dur="16s" repeatCount="indefinite"/>
    </path>
    <text x="62" y="199">auto: download · verify · hooks</text>
    <!-- box 5 -->
    <rect x="36" y="226" width="16" height="16" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <path d="M39 234 l4 4 l7 -8" stroke="#3FB68B" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.83125;0.98" dur="16s" repeatCount="indefinite"/>
    </path>
    <text x="62" y="239">verified — ask 0.5.2 on PATH</text>

    <text x="36" y="285" fill="#6B7280" font-size="11">no admin rights · no daemon · no API key</text>
    <text x="36" y="304" fill="#6B7280" font-size="11">checksum-verified from GitHub Releases</text>
    <text x="36" y="323" fill="#6B7280" font-size="11">uses your GPU for nothing — CPU-light hooks</text>
  </g>

  <!-- ====== right: terminal replay ====== -->
  <g>
    <rect x="360" y="58" width="510" height="420" rx="8" fill="#0A0E14" stroke="#2B2F36" stroke-width="1"/>
    <rect x="360" y="58" width="510" height="26" rx="8" fill="#1A1F27"/>
    <circle cx="378" cy="71" r="4.5" fill="#E0443E"/><circle cx="394" cy="71" r="4.5" fill="#DEA123"/><circle cx="410" cy="71" r="4.5" fill="#1AAB29"/>
    <text x="615" y="75" text-anchor="middle" fill="#9BA3AE" font-size="11">PowerShell — ATO-INSTALL</text>

    <g font-size="12.5">
      <text x="376" y="106" fill="#E6EDF3" opacity="0">PS ~\Downloads&gt; .\install.ps1<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.031;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="128" fill="url(#gold)" font-weight="bold" opacity="0">A S K  Token Optimizer — Windows x86_64<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.075;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="146" fill="#9BA3AE" opacity="0">token compression for Claude Code · Executive Edition<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.075;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="172" fill="#E6EDF3" opacity="0">Type 'accept' to agree to the LICENSE: <tspan fill="#3FB68B">accept</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="196" fill="url(#gold)" opacity="0">* Step 1  Registration<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2125;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="214" fill="#E6EDF3" opacity="0">Work email: <tspan fill="#3FB68B">you@company.com</tspan>   name: <tspan fill="#3FB68B">You</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2625;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="232" fill="#E6EDF3" opacity="0">Revenue UNDER CAD $100,000? [Y/n]: <tspan fill="#3FB68B">Y</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.3625;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="256" fill="#E6EDF3" opacity="0"><tspan fill="#3FB68B">OK</tspan> registered · license -&gt; ~\.ask\license.json<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4375;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="280" fill="url(#gold)" opacity="0">* Step 2  Installing the binary<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4875;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="298" fill="#9BA3AE" opacity="0">downloading ask-token-optimizer-windows-x86_64.exe …<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4875;0.98" dur="16s" repeatCount="indefinite"/></text>

      <!-- download progress bar -->
      <rect x="376" y="308" width="380" height="8" rx="4" fill="#1A1F27" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4875;0.98" dur="16s" repeatCount="indefinite"/>
      </rect>
      <rect x="376" y="308" width="0" height="8" rx="4" fill="url(#gold)">
        <animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.4875;0.625;0.98;0.981" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.4875;0.98" dur="16s" repeatCount="indefinite"/>
      </rect>

      <text x="376" y="336" fill="#E6EDF3" opacity="0"><tspan fill="#3FB68B">OK</tspan> checksum verified<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.6375;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="354" fill="#E6EDF3" opacity="0"><tspan fill="#3FB68B">OK</tspan> ask.exe -&gt; ~\.local\bin  <tspan fill="url(#gold)">(v0.5.2)</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.68125;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="372" fill="#E6EDF3" opacity="0"><tspan fill="#3FB68B">OK</tspan> PATH · <tspan fill="#3FB68B">OK</tspan> hooks staged -&gt; ~\.claude\hooks<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.74375;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="400" fill="#9BA3AE" opacity="0">--- Verification ---<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.79375;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="418" fill="url(#gold)" font-weight="bold" opacity="0">ask-token-optimizer 0.5.2<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.79375;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="446" fill="#E6EDF3" opacity="0">You are set up. Run <tspan fill="url(#gold)">ask audit</tspan> to see your savings<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.875;0.98" dur="16s" repeatCount="indefinite"/></text>
      <text x="376" y="466" fill="#6B7280" opacity="0">~60 seconds, end to end<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.9125;0.98" dur="16s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <text x="450" y="504" text-anchor="middle" fill="#6B7280" font-size="11">real flow, real prompts — captured from a live Windows install</text>
</svg>
